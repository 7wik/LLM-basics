[project]
name = "llm-basics"
version = "0.1.0"
description = "Transformer inference internals (attention, KV cache, ...) implemented from scratch in NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
